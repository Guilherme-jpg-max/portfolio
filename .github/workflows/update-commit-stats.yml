name: Update commit stats

on:
  schedule:
    - cron: "0 6 * * *" # todo dia às 06:00 UTC
  workflow_dispatch:
  # Roda também quando a própria lógica de contagem muda.
  push:
    branches: [main]
    paths:
      - scripts/update-commit-stats.ts
      - .github/workflows/update-commit-stats.yml

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Somar contribuições desde a criação da conta
        env:
          GH_TOKEN: ${{ secrets.COMMIT_STATS_TOKEN }}
        run: node scripts/update-commit-stats.ts

      - name: Commit if changed
        run: |
          git config user.name "commit-stats-bot"
          git config user.email "actions@github.com"
          git add src/data/commit-stats.json
          git diff --staged --quiet || git commit -m "chore: update commit stats [skip ci]"
          git push
