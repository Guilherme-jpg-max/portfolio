name: Update commit stats

on:
  schedule:
    - cron: "0 6 * * *" # todo dia às 06:00 UTC
  workflow_dispatch:
  # Roda também quando a própria lógica de contagem muda.
  push:
    branches: [main]
    paths:
      - scripts/update-commit-stats.ts
      - .github/workflows/update-commit-stats.yml

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Somar contribuições desde a criação da conta
        env:
          GH_TOKEN: ${{ secrets.COMMIT_STATS_TOKEN }}
        run: node scripts/update-commit-stats.ts

      - name: Commit se o total mudou
        id: commit
        run: |
          git config user.name "commit-stats-bot"
          git config user.email "actions@github.com"
          git add src/data/commit-stats.json
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: update commit stats [skip ci]"
          git pull --rebase origin main
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Commits feitos com o GITHUB_TOKEN não disparam outros workflows, então o
      # CI (que testa e publica o site com o número novo) é chamado explicitamente.
      - name: Disparar CI para publicar o novo total
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref main
