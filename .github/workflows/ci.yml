name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Disparado pelo workflow de estatísticas depois que ele commita um novo total.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Format, lint, typecheck, testes e build
        run: npm run check

  deploy:
    # Só publica a partir da main, e só depois de todas as checagens passarem.
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Decidir se publica
        id: gate
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Secrets CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID ausentes; deploy ignorado."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Se a main já avançou (ex.: o robô commitou um novo total de commits),
          # o run do commit mais novo publica; este não pode sobrescrevê-lo.
          latest=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo "::notice::main avançou para ${latest:0:7}; o deploy fica para o run desse commit."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.gate.outputs.deploy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - if: steps.gate.outputs.deploy == 'true'
        run: npm ci

      - name: Build e deploy no Cloudflare Workers
        if: steps.gate.outputs.deploy == 'true'
        run: npm run deploy
